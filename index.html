/* Checkbox-based multiple region selector. */
.region-multi{position:relative;border:1px solid #e8e5ec;background:#fff;border-radius:10px;color:#393540}
.region-multi:focus-within{border-color:#ed91b4}
.region-multi>summary{padding:10px 12px;min-height:41px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;font-size:13px}
.region-multi>summary::-webkit-details-marker{display:none}
.region-multi>summary::after{content:'⌄';font-size:17px;color:#7b7482}
.region-multi[open]>summary::after{content:'⌃'}
.region-options{padding:8px 10px 10px;border-top:1px solid var(--line);max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 5px}
.region-options .checkline{font-size:12px;margin:3px 0;min-width:0;cursor:pointer}
.region-options input{flex:none}

.region-selected{font-size:11px;color:#bd3268;line-height:1.5;margin-top:7px;overflow-wrap:anywhere}

.mainlayout{display:block;min-width:0}
.filterbar{position:relative;top:auto;padding:16px 20px;margin:0 0 18px;overflow:visible}
.filterbar .filtertitle{font-size:14px;margin:0 0 9px;display:flex;align-items:center;gap:12px}

<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">▤</div> JOB ZIP</div><div><div class="sidelabel">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div class="sidebottom"><strong>✦ 나만의 취업 준비 공간</strong>공고는 이 브라우저에 저장돼요. 설정에서 백업 파일을 내려받을 수 있어요.</div></aside>
<main class="content"><header class="topbar"><div><div class="eyebrow">MY JOB SEARCH WORKSPACE</div><h1 id="pagetitle">채용공고 모아보기</h1><div id="pagesub" class="subtitle"></div></div><div class="actions"><button class="btn" id="discoverBtn">⌕ 외부 공고 찾기</button><button class="btn primary" id="importLinkBtn">↘ 링크로 가져오기</button><button class="btn" id="addBtn">＋ 직접 등록</button></div></header><div id="screen"></div></main>
</div>
<div id="modalroot"></div><div id="toastroot" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='jobzip_personal_v1', TODAY=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`};
const plus=(n)=>{const d=new Date(TODAY()+'T12:00:00+09:00');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const escapeHTML=(s='')=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({jobs:[],settings:{newDays:3,hideClosed:true,regions:[],region:'전체 지역',employment:'전체 고용형태',entryOnly:true,theme:'pink'}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.jobs))data=defaultData();data.settings={...defaultData().settings,...(data.settings||{})};
// v4 removes only old built-in demo records, preserving every user-added posting.
if(data.jobs.some(x=>x.demo)){data.jobs=data.jobs.filter(x=>!x.demo);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
let state={page:'home',query:'',tab:'all',sort:'newest',regions:Array.isArray(data.settings.regions)?data.settings.regions.slice():[],employment:'전체 고용형태',entryOnly:true,detailId:null,editId:null,imageId:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('브라우저 저장 공간이 부족해요. 큰 이미지는 삭제하거나 설정에서 데이터를 백업해주세요.');return false}};
const get=id=>data.jobs.find(j=>j.id===id),uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`job-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const safeUrl=u=>{try{const v=new URL(String(u||'').trim());return ['https:','http:'].includes(v.protocol)?v.href:''}catch(e){return ''}};
const diffDays=d=>Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(TODAY()+'T00:00:00Z'))/86400000);
const dateLabel=j=>{if(j.deadlineType==='always')return '상시채용';if(j.deadlineType==='unknown'||!j.deadline)return '마감일 미정';const n=diffDays(j.deadline);return n<0?'마감':n===0?'D-DAY':`D-${n}`};
const dateClass=j=>{const n=j.deadlineType==='date'&&j.deadline?diffDays(j.deadline):null;return n!==null&&n<0?'closed':n!==null&&n<=3?'urgent':j.deadlineType==='always'?'always':'dday'};
const isNew=j=>diffDays(j.postedAt||j.addedAt||TODAY())>=-Number(data.settings.newDays||3)&&diffDays(j.postedAt||j.addedAt||TODAY())<=0;
const statusName={interested:'관심',applied:'지원완료',interview:'면접'};
const normalizeStatus=s=>['applied','interview'].includes(s)?s:['passed','rejected'].includes(s)?'interview':'interested';

let didMigrate=false;for(const j of data.jobs){const updated=normalizeStatus(j.status);if(j.status!==updated){if(j.status)j.previousStatus=j.status;j.status=updated;didMigrate=true}}

function jobsFiltered(page=state.page){let v=data.jobs.filter(j=>page!=='saved'||j.saved);if(state.query.trim()){const q=state.query.toLowerCase().trim();v=v.filter(j=>[j.company,j.title,j.category,j.region,j.source,j.requirements,j.responsibilities].some(x=>String(x||'').toLowerCase().includes(q)))}if(state.regions.length)v=v.filter(j=>state.regions.some(r=>String(j.region||'').includes(r)));if(state.employment!=='전체 고용형태')v=v.filter(j=>String(j.employment||'')===state.employment);if(state.entryOnly)v=v.filter(j=>!['경력','경력직'].includes(j.experience));if(data.settings.hideClosed)v=v.filter(j=>dateLabel(j)!=='마감');if(state.tab==='new'&&page==='home')v=v.filter(isNew);if(state.tab==='saved'&&page==='home')v=v.filter(j=>j.saved);if(state.tab==='urgent'&&page==='home')v=v.filter(j=>j.deadlineType==='date'&&diffDays(j.deadline)>=0&&diffDays(j.deadline)<=3);if(state.tab==='interested'&&page==='saved')v=v.filter(j=>j.status==='interested');if(state.tab==='applied'&&page==='saved')v=v.filter(j=>j.status==='applied');if(state.tab==='interview'&&page==='saved')v=v.filter(j=>j.status==='interview');v.sort((a,b)=>{if(state.sort==='deadline'){const x=j=>j.deadlineType==='date'&&j.deadline?Date.parse(j.deadline):Infinity;return x(a)-x(b)}if(state.sort==='name')return a.company.localeCompare(b.company,'ko');if(state.sort==='saved')return Number(b.saved)-Number(a.saved);return String(b.postedAt||b.addedAt||'').localeCompare(String(a.postedAt||a.addedAt||''))});return v}

function applicationsScreen(){const columns=[['interested','관심'],['applied','지원완료'],['interview','면접']];const saved=data.jobs.filter(j=>j.saved);return `<div class="note">공고별 지원 상태를 바꾸면 아래 단계에 자동 반영돼요. 지원 상태는 관심·지원완료·면접 세 단계로 관리해요.</div><div class="board">${columns.map(([s,t])=>{const list=saved.filter(j=>j.status===s);return `<div class="column"><h3>${t} <span class="badge">${list.length}</span></h3>${list.map(j=>`<div class="kanban"><span class="company">${escapeHTML(j.company)}</span><button class="jobtitle" style="display:block;font-size:13px" data-act="detail" data-id="${escapeHTML(j.id)}">${escapeHTML(j.title)}</button>${deadlineBadge(j)}<select class="select" style="margin-top:11px;font-size:12px" data-change="status" data-id="${escapeHTML(j.id)}">${Object.entries(statusName).map(([k,v])=>`<option value="${k}" ${j.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<div class="help" style="padding:18px 5px">등록된 공고가 없어요.</div>'}</div>`}).join('')}</div>`}
function imagesScreen(){const j=get(state.imageId)||data.jobs.find(x=>x.saved)||data.jobs[0];if(!j)return '<div class="card empty">이미지 카드로 만들 공고가 없어요. 공고를 등록해 주세요.</div>';state.imageId=j.id;return `<div class="cardbuilder"><div class="previewouter"><div class="posterpreview"><div class="posterheader"><div class="eyebrow">JOB ZIP · RECRUITMENT</div><h2>${escapeHTML(j.company)}<br>${escapeHTML(j.title)}</h2><p>${escapeHTML(j.region||'지역 미기재')} | ${escapeHTML(j.experience||'경력 미기재')} | ${escapeHTML(dateLabel(j))}</p></div><div class="posterbody">${[['담당 업무',j.responsibilities],['필수 요건',j.requirements],['우대 사항',j.preferred],['전형 절차',j.process]].map(([t,v])=>`<div class="postersection"><h4>[${t}]</h4><p>${escapeHTML(v||'정보 미입력')}</p></div>`).join('')}</div><div class="posterfooter">출처: ${escapeHTML(j.source||'직접 등록')}　·　원문 링크는 상세 화면에서 확인</div></div></div><aside class="card prefbox"><h3>이미지 카드 설정</h3><label class="fieldlabel" for="cardJob">공고 선택</label><select class="select" id="cardJob" data-change="imageId">${data.jobs.map(x=>`<option value="${escapeHTML(x.id)}" ${x.id===j.id?'selected':''}>${escapeHTML(x.company+' - '+x.title)}</option>`).join('')}</select><p class="help">첨부해준 채용공고 이미지처럼 세로형으로 정리했어. 담당 업무와 자격 요건은 등록한 정보를 사용해.</p><button class="btn primary" style="width:100%;margin-top:13px" data-act="downloadcard" data-id="${escapeHTML(j.id)}">↓ PNG 이미지 다운로드</button><button class="btn" style="width:100%;margin-top:9px" data-act="detail" data-id="${escapeHTML(j.id)}">공고 상세 보기</button><p class="hint">이미지는 브라우저에서 직접 만들어져요. 원본 공고 포스터는 공고 상세 화면에 별도로 첨부할 수 있어요.</p></aside></div>`}

async function submitJob(e){e.preventDefault();const form=e.currentTarget, fd=new FormData(form),s=k=>String(fd.get(k)||'').trim(),url=safeUrl(s('url'));if(s('url')&&!url){alert('http:// 또는 https:// 공고 링크만 등록할 수 있어요.');return}if(s('deadlineType')==='date'&&!s('deadline')){alert('마감일을 입력하거나 상시채용/마감일 미정을 선택해 주세요.');return}const old=state.editId?get(state.editId):null;const dup=data.jobs.find(j=>j.id!==old?.id&&((url&&j.url===url)||(j.company.trim().toLowerCase()===s('company').toLowerCase()&&j.title.trim().toLowerCase()===s('title').toLowerCase())));if(dup&&!confirm('비슷한 공고가 이미 등록돼 있어요. 그래도 저장할까요?'))return;let poster=old?.poster||'';if(document.getElementById('removePoster')?.checked)poster='';const file=document.getElementById('posterFile')?.files?.[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('PNG, JPG, WEBP 이미지만 등록할 수 있어요.');return}if(file.size>1500000){alert('이미지 용량은 1.5MB 이하로 줄여서 올려주세요.');return}poster=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});}const item={...old,id:old?.id||uid(),company:s('company'),title:s('title'),source:s('source'),url,category:s('category'),region:s('region'),experience:s('experience'),employment:s('employment'),deadlineType:s('deadlineType'),deadline:s('deadlineType')==='date'?s('deadline'):'',postedAt:s('postedAt'),addedAt:old?.addedAt||TODAY(),responsibilities:s('responsibilities'),requirements:s('requirements'),preferred:s('preferred'),process:s('process'),notes:old?.notes||'',status:old?.status||'interested',saved:old?.saved??true,priority:old?.priority||'medium',poster,demo:false};const copy=data.jobs.slice();if(old)data.jobs=data.jobs.map(x=>x.id===old.id?item:x);else data.jobs.unshift(item);if(!save()){data.jobs=copy;return}closeModal();state.detailId=item.id;render();toast(old?'공고를 수정했어요.':'공고를 저장했어요.')}
function closeModal(){document.getElementById('modalroot').innerHTML='';state.editId=null}
function discover(){const q=state.query.trim()||'신입 경력무관 인턴';const terms=q+' 채용';const sites=[['사람인','saramin.co.kr'],['잡코리아','jobkorea.co.kr'],['원티드','wanted.co.kr'],['고용24','work24.go.kr']];document.getElementById('modalroot').innerHTML=`<div class="overlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" style="max-width:520px"><div class="modalheading"><div><h2>외부에서 채용공고 찾기</h2><p class="help">아래는 각 채용 사이트를 대상으로 한 검색엔진 검색이에요. 결과가 자동으로 JOB ZIP에 등록되는 것은 아니에요.</p></div><button class="btn icononly" data-act="closemodal">×</button></div><label class="fieldlabel">검색 키워드</label><input class="input" id="externalQ" value="${escapeHTML(q)}"><div id="externalLinks" style="margin-top:18px;display:grid;gap:8px"></div><div class="note" style="margin-top:17px">지원 가능 여부와 마감일은 원본 공고에서 확인한 다음, 오른쪽 위 ‘＋ 공고 추가’로 저장해 주세요.</div></div></div>`;const input=document.getElementById('externalQ');const draw=()=>{document.getElementById('externalLinks').innerHTML=sites.map(([name,domain])=>{const url='https://www.google.com/search?q='+encodeURIComponent(`site:${domain} ${input.value||terms} 신입 OR 경력무관 OR 인턴`);return `<a class="btn" target="_blank" rel="noopener noreferrer" href="${escapeHTML(url)}" style="justify-content:space-between">${name} 검색 <span>↗</span></a>`}).join('')};input.addEventListener('input',draw);draw()}
function download(name,content,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function exportData(){download(`jobzip-backup-${TODAY()}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),jobs:data.jobs,settings:data.settings},null,2),'application/json;charset=utf-8');toast('백업 파일을 다운로드했어요.')}
function importData(file){if(!file||file.size>12*1024*1024){alert('12MB 이하의 JSON 백업 파일만 복원할 수 있어요.');return}const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!Array.isArray(obj.jobs)||obj.jobs.length>5000)throw new Error('invalid');if(!confirm('현재 공고 목록을 백업 파일 내용으로 교체할까요? 먼저 기존 데이터를 백업하는 것을 권장해요.'))return;const jobs=obj.jobs.filter(j=>j&&typeof j==='object').map(j=>({id:String(j.id||uid()),company:String(j.company||''),title:String(j.title||''),source:String(j.source||'직접 등록'),url:safeUrl(j.url),category:String(j.category||''),region:String(j.region||''),experience:String(j.experience||'신입'),employment:String(j.employment||'기타'),deadlineType:['date','always','unknown'].includes(j.deadlineType)?j.deadlineType:'unknown',deadline:String(j.deadline||''),postedAt:String(j.postedAt||''),addedAt:String(j.addedAt||TODAY()),responsibilities:String(j.responsibilities||''),requirements:String(j.requirements||''),preferred:String(j.preferred||''),process:String(j.process||''),notes:String(j.notes||''),status:normalizeStatus(j.status),saved:Boolean(j.saved),priority:String(j.priority||'medium'),poster:/^data:image\/(png|jpeg|webp);base64,/.test(j.poster||'')&&String(j.poster).length<2200000?j.poster:'',demo:!!j.demo})).filter(j=>j.company&&j.title);const prev=data;data={jobs,settings:{...defaultData().settings,...obj.settings}};if(!save()){data=prev;return}state.detailId=null;state.tab='all';render();toast(`${jobs.length}개 공고를 복원했어요.`)}catch(e){alert('지원되는 JOB ZIP 백업 파일인지 확인해 주세요.')}};r.readAsText(file)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=99){let lines=0;for(const paragraph of String(text||'정보 미입력').split('\n')){let line='';for(const ch of paragraph){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;lines++;line=ch;if(lines>=maxLines)return y}else line+=ch}ctx.fillText(line||' ',x,y);y+=lineHeight;lines++;if(lines>=maxLines)return y}return y}
function downloadCard(j){const canvas=document.createElement('canvas'),c=canvas.getContext('2d'),W=1080,p=74;canvas.width=W;canvas.height=6000;c.fillStyle='#ffffff';c.fillRect(0,0,W,6000);c.fillStyle='#ffd9e7';c.beginPath();c.arc(995,90,205,0,2*Math.PI);c.fill();c.beginPath();c.arc(0,650,130,0,2*Math.PI);c.fill();c.strokeStyle='#4f4752';c.lineWidth=2;c.beginPath();c.moveTo(0,370);c.lineTo(550,910);c.stroke();c.font='800 28px Arial, "Malgun Gothic", sans-serif';c.fillStyle='#bc4274';c.fillText('JOB ZIP  /  RECRUITMENT',p,110);c.fillStyle='#29252e';c.font='800 58px "Malgun Gothic", Arial, sans-serif';let y=210;y=wrapText(c,j.company,p,y,930,70,3)+14;c.font='800 52px "Malgun Gothic", Arial, sans-serif';y=wrapText(c,j.title,p,y,915,66,4)+20;c.font='700 28px "Malgun Gothic", Arial, sans-serif';c.fillStyle='#b93e73';y=wrapText(c,[j.region||'지역 미기재',j.experience||'경력 미기재',dateLabel(j)].join('  |  '),p,y,920,42,3)+85;c.strokeStyle='#e9dce4';c.beginPath();c.moveTo(p,y-25);c.lineTo(W-p,y-25);c.stroke();const sections=[['담당 업무',j.responsibilities],['필수 요건',j.requirements],['우대 사항',j.preferred],['전형 절차',j.process]];for(const [title,body] of sections){c.font='800 35px "Malgun Gothic", Arial, sans-serif';c.fillStyle='#db5086';c.fillText('['+title+']',p,y);y+=54;c.font='27px "Malgun Gothic", Arial, sans-serif';c.fillStyle='#4d4652';y=wrapText(c,body||'정보 미입력',p,y,W-p*2,43,20)+65}const height=Math.max(1530,Math.min(6000,y+115));const out=document.createElement('canvas');out.width=W;out.height=height;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,W,height);o.drawImage(canvas,0,0);o.fillStyle='#fff0f5';o.fillRect(0,height-100,W,100);o.fillStyle='#ad4071';o.font='25px "Malgun Gothic", Arial, sans-serif';o.fillText('출처  '+(j.source||'직접 등록')+'  ·  공고 원문은 저장된 링크에서 확인',p,height-40);out.toBlob(blob=>{if(!blob){alert('이미지 생성에 실패했어요.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`jobzip-${j.company.replace(/[\\/:*?"<>|]/g,'-')}-${TODAY()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('PNG 이미지를 다운로드했어요.')},'image/png')}
function navigate(p){state.page=p;state.tab='all';state.query='';state.detailId=null;state.employment='전체 고용형태';state.entryOnly=!!data.settings.entryOnly;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){if(e.target.id==='modalOverlay')closeModal();return}const a=el.dataset.act,id=el.dataset.id,j=get(id);if(a==='nav')navigate(id);else if(a==='add')modalJob();else if(a==='importlink')importLinkModal();else if(a==='doimportlink')handleLinkImport();else if(a==='saveurlonly')saveURLOnly();else if(a==='discover')discover();else if(a==='closemodal')closeModal();else if(a==='save'&&j){j.saved=!j.saved;save();render();toast(j.saved?'저장한 공고에 추가했어요.':'저장을 해제했어요.')}else if(a==='detail'&&j){state.detailId=id;render();window.scrollTo(0,0)}else if(a==='close'){state.detailId=null;render()}else if(a==='edit')modalJob(id);else if(a==='delete'&&j){if(confirm(`‘${j.company} - ${j.title}’ 공고를 삭제할까요?`)){data.jobs=data.jobs.filter(x=>x.id!==id);save();state.detailId=null;render();toast('공고를 삭제했어요.')}}else if(a==='image'&&j){state.imageId=id;navigate('images');state.imageId=id;render()}else if(a==='downloadcard'&&j)downloadCard(j);else if(a==='tab'){state.tab=id;render()}else if(a==='search'){state.query=document.getElementById('jobSearch')?.value||'';render()}else if(a==='resetfilters'){state.query='';state.regions=[];data.settings.regions=[];save();state.employment='전체 고용형태';state.entryOnly=false;state.tab='all';render()}else if(a==='clearregions'){state.regions=[];data.settings.regions=[];save();render();document.getElementById('regionsDropdown').open=true;}else if(a==='savenote'&&j){j.notes=document.getElementById('detailNotes').value;save();toast('메모를 저장했어요.')}else if(a==='export')exportData();else if(a==='import')document.getElementById('importFile').click();else if(a==='removedemos'){const count=data.jobs.filter(x=>x.demo).length;if(confirm(`예시 공고 ${count}개를 삭제할까요?`)){data.jobs=data.jobs.filter(x=>!x.demo);save();render();toast('예시 공고를 삭제했어요.')}}});
document.getElementById('addBtn').addEventListener('click',()=>modalJob());document.getElementById('discoverBtn').addEventListener('click',discover);document.getElementById('importLinkBtn').addEventListener('click',importLinkModal);
document.addEventListener('input',e=>{if(e.target.id==='jobSearch'){if(e.isComposing)return;state.query=e.target.value;const cursor=e.target.selectionStart;const screen=document.getElementById('screen');const oldY=window.scrollY;render();const input=document.getElementById('jobSearch');input.focus();input.setSelectionRange(cursor,cursor);window.scrollTo(0,oldY)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='importFile'){importData(t.files[0]);t.value='';return}if(!t.dataset.change)return;const op=t.dataset.change,v=t.type==='checkbox'?t.checked:t.value,j=get(t.dataset.id);if(op==='regionMulti'){state.regions=v?[...new Set([...state.regions,t.value])]:state.regions.filter(x=>x!==t.value);data.settings.regions=state.regions.slice();save()}else if(op==='employment')state.employment=v;else if(op==='entryOnly')state.entryOnly=v;else if(op==='sort')state.sort=v;else if(op==='hideClosed'){data.settings.hideClosed=v;save()}else if(op==='newDays'){data.settings.newDays=Number(v);save()}else if(op==='settingEntry'){data.settings.entryOnly=v;state.entryOnly=v;save()}else if(op==='status'&&j){j.status=v;j.saved=true;save();toast('지원 상태를 변경했어요.')}else if(op==='priority'&&j){j.priority=v;save();toast('우선순위를 변경했어요.')}else if(op==='imageId')state.imageId=v;const reopen=op==='regionMulti'&&document.getElementById('regionsDropdown')?.open;const focusedRegion=op==='regionMulti'?t.value:null;render();if(reopen){const dropdown=document.getElementById('regionsDropdown');if(dropdown){dropdown.open=true;const option=[...dropdown.querySelectorAll('input[data-change=regionMulti]')].find(x=>x.value===focusedRegion);option?.focus({preventScroll:true})}}});
render();
